# Release pipeline: push a tag like v1.0.0 to build and publish a ServiceBills release.
#
# Required GitHub Actions secrets (Settings > Secrets and variables > Actions > Repository secrets):
#   GHCR_PULL_USER          GitHub username of a dedicated bot account (embedded in the installer)
#   GHCR_PULL_TOKEN         classic PAT of that bot account, scope read:packages ONLY (embedded in the installer)
#   R2_BUCKET               Cloudflare R2 bucket name
#   R2_ENDPOINT             https://<account-id>.r2.cloudflarestorage.com
#   R2_ACCESS_KEY_ID        R2 API token (Object Read & Write on the bucket)
#   R2_SECRET_ACCESS_KEY    secret for that R2 token
#   RELEASE_PUBLISH_SECRET  same value as the Render env var of the same name
# Render (servicebills web service) env vars: RELEASE_PUBLISH_SECRET, INSTALLER_URL
#   (INSTALLER_URL = public URL of installer/ServiceBills-Setup.exe in the R2 bucket).
# GITHUB_TOKEN is provided automatically (packages: write / contents: write are granted per job below).
#
# This workflow triggers on tags only, so it never races with auto-build.yml
# (which commits the frontend bundle on pushes to main). Tag AFTER that commit has landed,
# because the image is built from the committed frontend/build.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.m.outputs.version }}
      release_date: ${{ steps.m.outputs.release_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only release tags on main
        run: |
          git fetch --force origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main'; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag a commit that has been merged to main."
            exit 1
          fi

      - name: Fail early if a required secret is empty
        env:
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_PUBLISH_SECRET: ${{ secrets.RELEASE_PUBLISH_SECRET }}
        run: |
          missing=0
          for name in GHCR_PULL_USER GHCR_PULL_TOKEN R2_BUCKET R2_ENDPOINT R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY RELEASE_PUBLISH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is empty or missing"
              missing=1
            fi
          done
          exit $missing

      - id: m
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "release_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

  image:
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ needs.meta.outputs.version }}
            APP_RELEASE_DATE=${{ needs.meta.outputs.release_date }}
          tags: |
            ghcr.io/hasbach/servicebills:${{ needs.meta.outputs.version }}
            ghcr.io/hasbach/servicebills:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  installer:
    needs: [meta, image]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        env:
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DGhcrUser=$env:GHCR_PULL_USER" "/DGhcrToken=$env:GHCR_PULL_TOKEN" onprem\installer\ServiceBills.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $exe = Get-ChildItem -Path onprem\installer -Recurse -Filter ServiceBills-Setup.exe | Select-Object -First 1
          if (-not $exe) { throw 'ServiceBills-Setup.exe was not produced' }
          Copy-Item $exe.FullName "$env:RUNNER_TEMP\ServiceBills-Setup.exe"

      - name: Upload to Cloudflare R2
        shell: pwsh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not support the newer default AWS CLI checksum behaviour.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          $src = "$env:RUNNER_TEMP\ServiceBills-Setup.exe"
          aws s3 cp $src "s3://$env:R2_BUCKET/installer/ServiceBills-Setup-$env:VERSION.exe" --endpoint-url $env:R2_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'R2 upload (versioned) failed' }
          aws s3 cp $src "s3://$env:R2_BUCKET/installer/ServiceBills-Setup.exe" --endpoint-url $env:R2_ENDPOINT
          if ($LASTEXITCODE -ne 0) { throw 'R2 upload (stable) failed' }

      - name: Attach to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $named = "$env:RUNNER_TEMP\ServiceBills-Setup-$env:VERSION.exe"
          Copy-Item "$env:RUNNER_TEMP\ServiceBills-Setup.exe" $named
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "ServiceBills $env:VERSION" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
          }
          gh release upload $env:GITHUB_REF_NAME $named --clobber
          if ($LASTEXITCODE -ne 0) { throw 'gh release upload failed' }

  publish:
    needs: [meta, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read tag message
        id: notes
        run: |
          git fetch --force --tags origin
          # Annotated tag message; empty for lightweight tags.
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | head -c 4000)"
          {
            echo 'notes<<EOF_NOTES'
            echo "$NOTES"
            echo 'EOF_NOTES'
          } >> "$GITHUB_OUTPUT"

      - name: Publish release metadata
        env:
          RELEASE_PUBLISH_SECRET: ${{ secrets.RELEASE_PUBLISH_SECRET }}
          VERSION: ${{ needs.meta.outputs.version }}
          RELEASE_DATE: ${{ needs.meta.outputs.release_date }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          BODY="$(jq -n --arg v "$VERSION" --arg d "$RELEASE_DATE" --arg n "$NOTES" \
            '{version:$v, release_date:$d} + (if $n == "" then {} else {notes:$n} end)')"
          curl -fsS -X POST https://servicebills.onrender.com/api/internal/releases \
            -H "X-Release-Secret: $RELEASE_PUBLISH_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY"
