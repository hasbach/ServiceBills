# Copy to C:\ProgramData\ServiceBillsAgent\agent.toml and fill in.
# This file contains device credentials -- restrict it to SYSTEM and
# Administrators (see README.md).

cloud_url    = "https://servicebills.onrender.com"
token        = "PASTE-THE-TOKEN-SHOWN-ONCE-WHEN-YOU-CREATED-THE-AGENT"
poll_seconds = 2

# How many customers this agent will let the cloud suspend per rolling hour.
# Unsuspends are never limited. This cap is enforced HERE, on this machine, so
# that a compromised cloud cannot disconnect your whole customer base -- it is
# the reason relaying suspend is safe at all. Raise it only if you genuinely
# suspend in batches. Default 5 if omitted.
max_suspends_per_hour = 5

[[device]]
id       = 1                  # must match the device's id in ServiceBills
host     = "192.168.8.1"
type     = "mikrotik_ccr"
api_port = 8728
use_tls  = false
username = "admin"
password = "ROUTEROS-PASSWORD"
# service_name = "pppoe-out"  # optional: only set this if this router hosts PPPoE secrets for more than one ISP, to disambiguate which secret "name" belongs to yours

[[device]]
id       = 2
host     = "192.168.8.100"
type     = "vsol_olt"
api_port = 161
password = "SNMP-COMMUNITY"
