# Render blueprint — a single web service, external Postgres (Supabase).
# Secrets marked sync:false are entered in the Render dashboard (never
# committed). Set DATABASE_URL to your Supabase SESSION-pooler URL.
#
# Scheduled jobs (generate_missing_payments, etc.) do NOT run in-process and
# do NOT need any other Render service. They used to run on an in-process
# APScheduler that fired immediately on import, in EVERY process that
# imported app.py with RUN_SCHEDULER=1 -- not just one gunicorn worker among
# several (WEB_CONCURRENCY>1, no --preload, so each forked worker got its own
# scheduler), but also `flask db upgrade` and `flask create-superadmin` (both
# import app.py too, ahead of gunicorn on every deploy), plus Render's
# zero-downtime deploy keeping the outgoing instance alive briefly alongside
# the incoming one. On one real deploy that combination produced a boot that
# hung for minutes with zero log output (blocked on a Postgres row lock from
# an overlapping fire) and, on the retry, the same job executing four times
# in ~100 seconds.
#
# The fix: each job is triggered externally over HTTP, by GitHub Actions'
# free `schedule:` cron (see .github/workflows/scheduled-jobs.yml), which
# POSTs to /api/internal/scheduled-jobs/<name> (app.py) with the
# CRON_TRIGGER_SECRET below. An earlier version of this fix used a Render
# Cron Job per job instead -- correct, but each Cron Job service carries its
# own $1/month minimum regardless of actual usage, which stopped being worth
# it once it was seven of them (or a dedicated always-on worker service,
# which is a full second paid instance). This way, nothing new needs to be
# created or paid for on Render at all: the trigger just calls back into the
# web service that's already running. See DEPLOY.md's "Scheduled jobs".
services:
  - type: web
    name: servicesbills-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # $0 — spins down when idle (~30-60s cold start). Bump to "starter" for always-on.
    healthCheckPath: /api/health   # checks DB connectivity, not just a static file (Phase 2)
    # No dockerCommand: the Dockerfile CMD already runs migrations + gunicorn on $PORT.
    envVars:
      - key: DATABASE_URL
        sync: false        # paste your Supabase Session-pooler connection string
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FLASK_APP
        value: app.py
      - key: DISABLE_AUTO_CREATE_ALL
        value: "1"
      - key: WEB_CONCURRENCY
        value: "4"   # Min 3 needed: (1) WhatsApp/WebSocket, (2) ElevenLabs tool webhook, (3) on-premise agent poll+result
      - key: CRON_TRIGGER_SECRET
        generateValue: true   # copy this into the GitHub repo's Actions secrets as CRON_TRIGGER_SECRET
      - key: FERNET_KEY
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # R2 + SendGrid are live: storage writes to Cloudflare R2, email sends via
      # SendGrid's HTTP API (Render blocks outbound SMTP -- confirmed live, direct
      # SMTP hangs/fails). Fill the sync:false vars below in the Render dashboard.
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_PREFIX
        value: uploads
      - key: AWS_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: WHISH_CHANNEL
        sync: false        # not yet issued -- self-serve Whish checkout stays hidden until this is set
      - key: WHISH_SECRET
        sync: false
      - key: MAIL_BACKEND
        value: sendgrid
      - key: SENDGRID_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Web Push (Service Management "Enable Notifications" button). Copy the pair
      # already generated in the local, gitignored vapid_keys.env, or generate a
      # fresh one with `vapid --gen` (py-vapid CLI) or webpush.org's key generator.
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      # Error tracking (Phase 2). Sign up for a Sentry account (free tier is enough
      # at current scale) and paste the project DSN here. Leave unset and error
      # tracking simply stays off -- it's not required for the app to run.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
